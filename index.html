<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172554" />
  <title>Shuttle Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- SPLASH SCREEN -->
  <section id="splash" class="splash">
    <div>
      <div class="splash-mark">🏸</div>
      <h1>Shuttle Tracker</h1>
      <p>Indian Club Badminton Section</p>
    </div>
  </section>

  <!-- LOGIN SCREEN -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">ST</div>
        <div><h1>Shuttle Tracker</h1><small>Club operations and community directory</small></div>
      </div>
      <div id="rolePills" class="role-pills">
        <button class="pill active" data-role="PLAYER">Player</button>
        <button class="pill" data-role="LEVEL_ADMIN">Level Admin</button>
        <button class="pill" data-role="SUPER_ADMIN">Super Admin</button>
        <button class="pill" data-role="BUSINESS_ADVERTISER">Business</button>
      </div>
      <div class="field"><label>Email or temporary username</label><input placeholder="Enter your login" /></div>
      <div class="field"><label>Password</label><input type="password" placeholder="Enter your password" /></div>
      <button id="openApp" class="primary">Open Shuttle Tracker</button>
    </div>
  </section>

  <!-- MAIN APPLICATION -->
  <main id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <button id="menu" class="menu-btn">☰</button>
        <div class="brand-mark">ST</div>
        <div><h1>Shuttle Tracker</h1><small>Indian Club Badminton Section</small></div>
      </div>
      <div class="user-dot"><span id="roleLabel">Player</span><div class="avatar">NF</div></div>
    </header>

    <div class="layout">
      <aside id="side" class="side">
        <div class="brand"><div class="brand-mark">ST</div><div><b>Nuzhath Fathima</b><small id="sideRole">Player · Flight 1</small></div></div>
        <div class="nav-group">MAIN</div>
        <button class="nav active" data-page="home">Home</button>
        <button class="nav" data-page="timetable">My Timetable</button>
        <button class="nav" data-page="attendance">Attendance</button>
        <button class="nav" data-page="wallet">Wallet & Payments</button>
        <button class="nav" data-page="history">My History</button>

        <div class="nav-group">OPERATIONS</div>
        <button class="nav admin-nav" data-page="sessions">Session Control</button>
        <button class="nav admin-nav" data-page="stock">Shuttle Stock</button>
        <button class="nav admin-nav" data-page="reports">Reports & Print</button>

        <div class="nav-group">SUPER ADMIN</div>
        <button class="nav super-nav" data-page="master">Master Timetable</button>
        <button class="nav super-nav" data-page="flights">Flights & Members</button>
        <button class="nav super-nav" data-page="finance">Finance & Arrears</button>
        <button class="nav super-nav" data-page="ads">Advertising</button>
        <button class="nav super-nav" data-page="audit">Audit History</button>

        <div class="nav-group">COMMUNITY</div>
        <button class="nav" data-page="announcements">Announcements</button>
        <button class="nav" data-page="bazaar">Indi Mart</button>
        <button class="nav" data-page="profile">My Profile</button>
      </aside>

      <section id="view" class="main"></section>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- SCRIPT LOADING IN DEPENDENCY ORDER -->
  <script src="js/config.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modules/views.js"></script>
  <script src="js/modules/adminViews.js"></script>
  <script src="js/modules/auth.js"></script>

</body>
</html>
