
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Club Bahrain - Premium App</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- LOADING SCREEN -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader"></div>
        <h2>Indian Club Bahrain</h2>
        <p>Loading your premium experience...</p>
    </div>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-screen" style="display: none;">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-logo">🏸</div>
                <h1>Indian Club</h1>
                <p class="auth-subtitle">Bahrain's Premier Sports Club</p>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="Enter your email" value="superadmin@club.com">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="Enter password" value="any">
                </div>
                
                <button class="btn btn-primary" onclick="handleLogin()" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="app-container" style="display: none;">
        <!-- HEADER -->
        <div class="premium-header">
            <div class="header-brand">
                <div class="brand-icon">🏸</div>
                <h1>Indian Club</h1>
            </div>
            
            <div class="header-center">
                <span class="role-badge" id="userRole">Player</span>
            </div>
            
            <div class="header-actions">
                <div class="user-profile">
                    <span class="user-name" id="userName">User</span>
                    <button class="btn-icon" id="signOutBtn" title="Sign Out">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="main-app">
            <!-- SIDEBAR -->
            <div class="premium-sidebar">
                <div class="sidebar-menu" id="sidebarMenu"></div>
            </div>

            <!-- CONTENT -->
            <div class="premium-main">
                <div class="premium-content">
                    <div class="content-wrapper" id="pageContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ============================================
         SCRIPT LOADING ORDER - CRITICAL!
         ============================================ -->

    <!-- 1. LOAD CONFIG FIRST -->
    <script src="js/modules/config.js"></script>

    <!-- 2. LOAD AUTH -->
    <script src="js/modules/auth.js"></script>

    <!-- 3. LOAD ROUTER -->
    <script src="js/modules/router.js"></script>

    <!-- 4. LOAD ALL VIEW FILES (SUPER IMPORTANT!) -->
    <script src="js/modules/adminViews.js"></script>
    <script src="js/modules/flightAdminViews.js"></script>
    <script src="js/modules/views.js"></script>

    <!-- 5. LOAD APP CONTROLLER LAST -->
    <script src="js/modules/app.js"></script>

    <!-- 6. LOAD SERVICE WORKER -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('js/sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
