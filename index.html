
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Club Bahrain - Member Portal</title>
  
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23667eea'>IC</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
    
    #login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    
    .login-container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 480px; width: 90%; }
    
    .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 30px; text-align: center; }
    .login-header h1 { font-size: 28px; margin-bottom: 10px; }
    .login-header p { opacity: 0.9; font-size: 14px; }
    
    .login-tabs { display: flex; border-bottom: 1px solid #e0e6ed; }
    .login-tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; border: none; background: none; font-weight: 600; color: #999; transition: all 0.3s; }
    .login-tab.active { color: #667eea; border-bottom: 3px solid #667eea; }
    
    .login-content { padding: 30px; }
    .login-form { display: none; }
    .login-form.active { display: block; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #e0e6ed; border-radius: 8px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    
    #errorMessage { color: #ff4757; font-size: 14px; margin-bottom: 15px; padding: 10px; background: #ffe0e0; border-radius: 6px; display: none; }
    #errorMessage:not(:empty) { display: block; }
    
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 14px; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; width: 100%; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
    
    #app { display: none; display: flex; height: 100vh; background: #f5f7fa; }
    
    .header { position: sticky; top: 0; background: white; border-bottom: 1px solid #e0e6ed; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    
    .sidebar { width: 260px; background: white; border-right: 1px solid #e0e6ed; overflow-y: auto; padding: 20px 0; }
    .sidebar-brand { padding: 20px; text-align: center; cursor: pointer; }
    .sidebar-brand h2 { font-size: 14px; color: #667eea; font-weight: 700; }
    .sidebar-brand p { font-size: 11px; color: #999; }
    
    .sidebar-profile { padding: 20px; border-bottom: 1px solid #e0e6ed; text-align: center; }
    .profile-avatar { width: 50px; height: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; margin: 0 auto 10px; }
    .profile-name { font-weight: 600; color: #333; font-size: 14px; margin-bottom: 5px; }
    .role-badge { display: inline-block; background: #667eea; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #666; text-decoration: none; cursor: pointer; transition: all 0.3s; border-left: 3px solid transparent; font-size: 14px; }
    .nav-link:hover { background: #f5f7fa; color: #667eea; }
    .nav-link.active { background: #f0f3ff; color: #667eea; border-left-color: #667eea; font-weight: 600; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #content { flex: 1; overflow-y: auto; padding: 30px; }
    
    .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card h2 { font-size: 18px; margin-bottom: 20px; color: #333; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .stat-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; }
    .stat-content h3 { font-size: 24px; font-weight: 700; color: #333; margin: 0; }
    .stat-content p { font-size: 13px; color: #999; margin: 5px 0 0 0; }
    
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table thead { background: #f5f7fa; border-bottom: 2px solid #e0e6ed; }
    .data-table th { padding: 12px; text-align: left; font-weight: 600; color: #666; }
    .data-table td { padding: 12px; border-bottom: 1px solid #e0e6ed; }
    
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #d4edda; color: #155724; }
    
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <div class="login-container">
      <div class="login-header">
        <h1>🏏 Indian Club Bahrain</h1>
        <p>Member Portal</p>
      </div>
      
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('login')">Sign In</button>
        <button class="login-tab" onclick="switchTab('activate')">Activate</button>
      </div>
      
      <div class="login-content">
        <div id="errorMessage"></div>
        
        <form id="loginForm" class="login-form active" onsubmit="doLogin(event)">
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="ahmed@club.com" required>
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="password" placeholder="any password" required>
          </div>
          <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        
        <form id="activateForm" class="login-form" onsubmit="doActivate(event)">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="actName" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label>Phone *</label>
            <input type="tel" id="actPhone" placeholder="+973-XXXX-XXXX" required>
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="actPass" placeholder="Min 6 chars" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary">Activate</button>
        </form>
      </div>
    </div>
  </div>
  
  <!-- APP -->
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Indian Club</h2>
        <p>Powered by A1 Groups</p>
      </div>
      
      <div class="sidebar-profile">
        <div class="profile-avatar" id="avatar">IC</div>
        <div class="profile-name" id="userName">Member</div>
        <div class="role-badge" id="roleLabel">PLAYER</div>
      </div>
      
      <nav style="padding: 20px 0;">
        <div style="padding: 0 20px; font-size: 11px; font-weight: 700; color: #999; margin-bottom: 10px;">MAIN</div>
        <a class="nav-link active" onclick="goPage('home')"><i class="fas fa-home"></i> <span>Home</span></a>
        <a class="nav-link" onclick="goPage('timetable')"><i class="fas fa-calendar"></i> <span>Timetable</span></a>
        <a class="nav-link" onclick="goPage('attendance')"><i class="fas fa-check-circle"></i> <span>Attendance</span></a>
        <a class="nav-link" onclick="goPage('wallet')"><i class="fas fa-wallet"></i> <span>Wallet</span></a>
      </nav>
    </aside>
    
    <div class="main-content">
      <header class="header">
        <h2 style="color: #667eea;">Indian Club Bahrain</h2>
        <button onclick="doLogout()" style="background: none; border: none; cursor: pointer; font-size: 18px; color: #667eea;">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </header>
      
      <div id="content">
        <div class="card">
          <h2>Welcome</h2>
          <p>Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== SIMPLE LOGIN =====
    function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      console.log('Login:', email);
      
      // Create member
      const member = {
        uid: 'user_' + Date.now(),
        email: email,
        fullName: email.split('@')[0].toUpperCase(),
        role: 'PLAYER',
        flightName: 'Badminton - Premier'
      };
      
      // Save
      localStorage.setItem('member', JSON.stringify(member));
      sessionStorage.setItem('token', 'token_' + Date.now());
      
      // Show app
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      
      // Update UI
      document.getElementById('avatar').textContent = member.fullName.substring(0, 2);
      document.getElementById('userName').textContent = member.fullName;
      document.getElementById('roleLabel').textContent = member.role;
      
      // Show home
      showHome();
    }
    
    function doActivate(e) {
      e.preventDefault();
      const name = document.getElementById('actName').value;
      
      const member = {
        uid: 'user_' + Date.now(),
        email: name.toLowerCase().replace(' ', '') + '@club.com',
        fullName: name,
        role: 'PLAYER',
        flightName: 'Badminton - Premier'
      };
      
      localStorage.setItem('member', JSON.stringify(member));
      sessionStorage.setItem('token', 'token_' + Date.now());
      
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      
      document.getElementById('avatar').textContent = member.fullName.substring(0, 2);
      document.getElementById('userName').textContent = member.fullName;
      
      showHome();
    }
    
    function doLogout() {
      localStorage.removeItem('member');
      sessionStorage.removeItem('token');
      document.getElementById('login').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
    
    function switchTab(tab) {
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('activateForm').classList.remove('active');
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      
      if (tab === 'login') {
        document.getElementById('loginForm').classList.add('active');
        document.querySelectorAll('.login-tab')[0].classList.add('active');
      } else {
        document.getElementById('activateForm').classList.add('active');
        document.querySelectorAll('.login-tab')[1].classList.add('active');
      }
    }
    
    function goPage(page) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      event.target.closest('.nav-link').classList.add('active');
      
      if (page === 'home') showHome();
      else if (page === 'timetable') showTimetable();
      else if (page === 'attendance') showAttendance();
      else if (page === 'wallet') showWallet();
    }
    
    function showHome() {
      const member = JSON.parse(localStorage.getItem('member') || '{}');
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h2>👋 Welcome, ${member.fullName}!</h2>
          <p>You are logged in as: <strong>${member.role}</strong></p>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background: #667eea;">📅</div>
            <div class="stat-content">
              <h3>5</h3>
              <p>Upcoming Sessions</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #00d4aa;">✓</div>
            <div class="stat-content">
              <h3>12</h3>
              <p>Attended</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #ffa502;">💰</div>
            <div class="stat-content">
              <h3>50 BHD</h3>
              <p>Wallet Balance</p>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h2>📋 Upcoming Sessions</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Activity</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Sep 14, 2026</td>
                <td>6:00 AM - 7:30 AM</td>
                <td>Badminton - Premier</td>
                <td><span class="badge badge-success">Scheduled</span></td>
              </tr>
              <tr>
                <td>Sep 16, 2026</td>
                <td>6:00 AM - 7:30 AM</td>
                <td>Badminton - Premier</td>
                <td><span class="badge badge-success">Scheduled</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
    
    function showTimetable() {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h2>📅 My Timetable</h2>
          <table class="data-table">
            <thead>
              <tr><th>Day</th><th>Time</th><th>Activity</th></tr>
            </thead>
            <tbody>
              <tr><td>Monday</td><td>6:00 - 7:30 AM</td><td>Badminton</td></tr>
              <tr><td>Wednesday</td><td>6:00 - 7:30 AM</td><td>Badminton</td></tr>
              <tr><td>Friday</td><td>6:00 - 7:30 AM</td><td>Badminton</td></tr>
            </tbody>
          </table>
        </div>
      `;
    }
    
    function showAttendance() {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h2>✓ Attendance</h2>
          <p>Total Attended: <strong>12 sessions</strong></p>
          <p>Attendance Rate: <strong>85%</strong></p>
        </div>
      `;
    }
    
    function showWallet() {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h2>💰 Wallet & Payments</h2>
          <p>Current Balance: <strong>50 BHD</strong></p>
          <p>Status: <strong>Paid</strong></p>
        </div>
      `;
    }
    
    // Check if logged in
    window.addEventListener('load', () => {
      const token = sessionStorage.getItem('token');
      if (token) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        const member = JSON.parse(localStorage.getItem('member') || '{}');
        document.getElementById('avatar').textContent = member.fullName?.substring(0, 2) || 'IC';
        document.getElementById('userName').textContent = member.fullName || 'Member';
        showHome();
      }
    });
  </script>
</body>
</html>
