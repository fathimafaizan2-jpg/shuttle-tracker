<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Club Bahrain - Member Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; color: #333; }

        #login { display: block; }
        #app { display: none; }

        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #667eea; margin-bottom: 30px; font-size: 28px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #e0e6ed; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }

        .login-btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; transition: background 0.3s; }
        .login-btn:hover { background: #5568d3; }

        .error-message { color: #ff4757; font-size: 14px; margin-top: 10px; text-align: center; }

        .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 32px; color: #333; margin-bottom: 8px; }
        .page-header p { color: #666; font-size: 16px; }

        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card h2 { font-size: 20px; margin-bottom: 20px; color: #333; }
        .card h3 { font-size: 18px; margin-bottom: 15px; color: #333; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; gap: 15px; align-items: flex-start; }
        .stat-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; flex-shrink: 0; }
        .stat-content h3 { margin: 0 0 5px 0; font-size: 24px; color: #333; }
        .stat-content p { margin: 0 0 5px 0; color: #666; font-size: 14px; }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table thead tr { background: #f5f7fa; border-bottom: 2px solid #e0e6ed; }
        .data-table th { padding: 12px; text-align: left; font-weight: 600; color: #333; }
        .data-table td { padding: 12px; border-bottom: 1px solid #e0e6ed; }
        .data-table tbody tr:hover { background: #f9fafb; }

        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary { background: #00d4aa; color: white; }
        .btn-secondary:hover { background: #00b896; }

        .navbar { background: white; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-radius: 8px; }
        .navbar h1 { font-size: 20px; color: #667eea; }
        .navbar-menu { display: flex; gap: 10px; }
        .navbar-menu button { padding: 8px 12px; background: #f5f7fa; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .navbar-menu button:hover { background: #667eea; color: white; }
        .navbar-menu button.active { background: #667eea; color: white; }

        .loading { text-align: center; padding: 20px; color: #999; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 24px; }
            .navbar { flex-direction: column; gap: 10px; }
            .navbar-menu { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="login">
        <div class="login-container">
            <div class="login-box">
                <h1>🏏 Indian Club Bahrain</h1>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="role" required>
                            <option value="PLAYER">Player</option>
                            <option value="LEVEL_ADMIN">Flight Admin</option>
                            <option value="SUPER_ADMIN">Super Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                    <div id="errorMessage" class="error-message"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- App Page -->
    <div id="app" style="display: none;">
        <div class="navbar">
            <h1>🏏 Indian Club Bahrain</h1>
            <div class="navbar-menu">
                <button onclick="navigateTo('home')" class="nav-btn active">Home</button>
                <button onclick="navigateTo('members')" class="nav-btn" id="membersBtn" style="display: none;">Members</button>
                <button onclick="navigateTo('attendance')" class="nav-btn">Attendance</button>
                <button onclick="navigateTo('wallet')" class="nav-btn">Wallet</button>
                <button onclick="handleLogout()" class="nav-btn">Logout</button>
            </div>
        </div>

        <div class="page-container">
            <div id="content"></div>
        </div>
    </div>

    <script>
        const appState = {
            user: null,
            role: null,
            token: null,
            currentPage: 'home'
        };

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const errorEl = document.getElementById('errorMessage');

            try {
                errorEl.textContent = '';

                if (!email || !password) {
                    throw new Error('Please enter email and password');
                }

                const token = 'token_' + Date.now();

                localStorage.setItem('authToken', token);
                localStorage.setItem('userRole', role);
                localStorage.setItem('userEmail', email);

                appState.user = { email, role };
                appState.role = role;
                appState.token = token;

                console.log('✅ Login successful! Role:', role);

                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';

                if (role === 'SUPER_ADMIN') {
                    document.getElementById('membersBtn').style.display = 'inline-block';
                }

                setTimeout(() => {
                    renderPage('home');
                }, 100);

            } catch (error) {
                errorEl.textContent = error.message;
                console.error('Login error:', error);
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userRole');
                localStorage.removeItem('userEmail');

                appState.user = null;
                appState.role = null;
                appState.token = null;

                document.getElementById('app').style.display = 'none';
                document.getElementById('login').style.display = 'block';

                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('errorMessage').textContent = '';
            }
        }

        function navigateTo(page) {
            appState.currentPage = page;
            renderPage(page);
        }

        function renderPage(page) {
            const content = document.getElementById('content');
            const role = appState.role;

            switch(page) {
                case 'home':
                    content.innerHTML = renderHome();
                    break;
                case 'members':
                    if (role === 'SUPER_ADMIN') {
                        content.innerHTML = renderMembers();
                    }
                    break;
                case 'attendance':
                    content.innerHTML = renderAttendance();
                    break;
                case 'wallet':
                    content.innerHTML = renderWallet();
                    break;
                default:
                    content.innerHTML = '<p>Page not found</p>';
            }
        }

        function renderHome() {
            const role = appState.role;
            let html = `
                <div class="page-header">
                    <h1>Welcome, ${appState.user.email}</h1>
                    <p>Role: <strong>${role}</strong></p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #667eea;">📊</div>
                        <div class="stat-content">
                            <h3>Dashboard</h3>
                            <p>View your statistics</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #00d4aa;">💰</div>
                        <div class="stat-content">
                            <h3>Wallet</h3>
                            <p>0.000 BHD</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #ffa502;">✓</div>
                        <div class="stat-content">
                            <h3>Attendance</h3>
                            <p>0 sessions</p>
                        </div>
                    </div>
                </div>
            `;

            if (role === 'SUPER_ADMIN') {
                html += `
                    <div class="card">
                        <h2>Super Admin Dashboard</h2>
                        <p>Manage members, timetable, advertising, and reports</p>
                        <button class="btn btn-primary" onclick="navigateTo('members')">Go to Members</button>
                    </div>
                `;
            } else if (role === 'LEVEL_ADMIN') {
                html += `
                    <div class="card">
                        <h2>Flight Admin Dashboard</h2>
                        <p>Manage attendance, session control, and shuttle stock</p>
                        <button class="btn btn-primary" onclick="navigateTo('attendance')">Go to Attendance</button>
                    </div>
                `;
            } else {
                html += `
                    <div class="card">
                        <h2>Player Dashboard</h2>
                        <p>View timetable, attendance, and wallet</p>
                        <button class="btn btn-primary" onclick="navigateTo('attendance')">View Attendance</button>
                    </div>
                `;
            }

            return html;
        }

        function renderMembers() {
            return `
                <div class="page-header">
                    <h1>Members Management</h1>
                </div>

                <div class="card">
                    <h2>All Members</h2>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="4" class="loading">Loading members...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderAttendance() {
            return `
                <div class="page-header">
                    <h1>Attendance</h1>
                </div>

                <div class="card">
                    <h2>Attendance Log</h2>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Activity</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="3" class="loading">Loading attendance...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderWallet() {
            return `
                <div class="page-header">
                    <h1>Wallet & Payments</h1>
                </div>

                <div class="card">
                    <h2>Current Balance</h2>
                    <h3 style="color: #667eea; font-size: 32px;">0.000 BHD</h3>
                </div>

                <div class="card">
                    <h2>Payment Options</h2>
                    <button class="btn btn-primary">Pay by Cash</button>
                    <button class="btn btn-secondary">Pay by Benefit</button>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            const role = localStorage.getItem('userRole');
            const email = localStorage.getItem('userEmail');

            if (token && role && email) {
                appState.user = { email, role };
                appState.role = role;
                appState.token = token;

                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';

                if (role === 'SUPER_ADMIN') {
                    document.getElementById('membersBtn').style.display = 'inline-block';
                }

                renderPage('home');
            }
        });
    </script>

    <script type="module">
        import('./js/modules/main.js').catch(err => console.error('Error loading main.js:', err));
    </script>
</body>
</html>
